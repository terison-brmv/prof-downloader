name: Idea or suggestion
description: Something you would like the app to do
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like to do, and why? A short example of how you would use it is great.
    validations:
      required: true
  - type: textarea
    id: alt
    attributes:
      label: How do you do it now (optional)
